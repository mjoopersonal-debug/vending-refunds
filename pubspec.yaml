name: vending_refunds
description: Vending refund manager with exact alarms.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  alarm: 5.15.0
  permission_handler: ^11.3.1
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/alarm.wav
