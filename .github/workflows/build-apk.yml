name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html request.html firebase-config.js manifest.json sw.js alarm.mp3 www/
          if [ -f alarm.mp3 ]; then cp alarm.mp3 www/alarm.mp3; fi
          if [ -f icon.png ]; then cp icon.png www/icon.png; fi
          if [ -f icon.PNG ]; then cp icon.PNG www/icon.png; fi

      - name: Install Capacitor and create the Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Set the app icon
        run: |
          if [ -f www/icon.png ]; then
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp www/icon.png android/app/src/main/res/$d/ic_launcher.png
              cp www/icon.png android/app/src/main/res/$d/ic_launcher_round.png
              cp www/icon.png android/app/src/main/res/$d/ic_launcher_foreground.png
            done
          fi

      - name: Build the debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: vending-refunds-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
