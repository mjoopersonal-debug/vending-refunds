name: Build Alarm APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create --org com.softies --project-name vending_refunds --platforms android .

      - name: Patch Android for alarms
        run: |
          python3 - << 'PYEOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ['SCHEDULE_EXACT_ALARM','USE_EXACT_ALARM','POST_NOTIFICATIONS','WAKE_LOCK','VIBRATE','USE_FULL_SCREEN_INTENT','RECEIVE_BOOT_COMPLETED','FOREGROUND_SERVICE','FOREGROUND_SERVICE_MEDIA_PLAYBACK','REQUEST_IGNORE_BATTERY_OPTIMIZATIONS','INTERNET']
          add = ''.join('    <uses-permission android:name="android.permission.%s"/>\n' % x for x in perms)
          s = s.replace('<application', add + '    <application', 1)
          s = s.replace('<activity', '<activity android:showWhenLocked="true" android:turnScreenOn="true"', 1)
          open(p, 'w').write(s)
          for g in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              try:
                  t = open(g).read()
              except FileNotFoundError:
                  continue
              t = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 26', t)
              t = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 26', t)
              t = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', t)
              t = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', t)
              open(g, 'w').write(t)
          print('patched')
          PYEOF

      - name: Build the APK
        run: |
          flutter pub get
          flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v4
        with:
          name: alarm-apk
          path: build/app/outputs/flutter-apk/app-release.apk
