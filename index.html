<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2e7d32">
<link rel="manifest" href="manifest.json">
<title>Vending Refunds</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f4; }
  header { background: #2e7d32; color: #fff; padding: 14px; font-size: 20px; display: flex; justify-content: space-between; align-items: center; }
  header button { background: #fff; color: #2e7d32; border: 0; padding: 6px 10px; border-radius: 4px; }
  .tabs { display: flex; background: #fff; }
  .tabs button { flex: 1; padding: 12px; border: 0; background: none; font-size: 16px; border-bottom: 3px solid transparent; }
  .tabs button.active { border-bottom-color: #2e7d32; color: #2e7d32; font-weight: bold; }
  .card { background: #fff; margin: 10px; padding: 12px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.15); border-left: 6px solid #d32f2f; }
  .card.done { border-left-color: #2e7d32; }
  .card .phone { font-size: 18px; font-weight: bold; }
  .card .meta { color: #555; font-size: 14px; margin-top: 4px; white-space: pre-line; }
  .actions { margin-top: 10px; display: flex; gap: 8px; }
  .actions button { flex: 1; padding: 10px; border: 0; border-radius: 6px; color: #fff; font-size: 15px; }
  .btn-chat { background: #25d366; }
  .btn-done { background: #1565c0; }
  .empty { text-align: center; color: #777; margin-top: 40px; }
  #login { max-width: 320px; margin: 80px auto; background: #fff; padding: 20px; border-radius: 8px; }
  #login input, #settings input { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; font-size: 16px; }
  #login button, #settings button { width: 100%; padding: 12px; background: #2e7d32; color: #fff; border: 0; border-radius: 6px; font-size: 16px; margin-top: 6px; }
  #settings { background: #fff; margin: 10px; padding: 16px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  #settings .note { color: #555; font-size: 14px; margin-top: 10px; }
  #error { color: #d32f2f; font-size: 14px; }
  .hidden { display: none; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px; border-radius: 6px; display: none; }
</style>
</head>
<body>

<div id="login">
  <h3>Owner sign-in</h3>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="signIn()">Sign in</button>
  <p id="error"></p>
</div>

<div id="app" class="hidden">
  <header>
    <span>Vending Refunds</span>
    <button onclick="signOutOwner()">Sign out</button>
  </header>
  <div class="tabs">
    <button id="tabPending" class="active" onclick="showTab('Pending')">Pending</button>
    <button id="tabDone" onclick="showTab('Done')">Done</button>
    <button id="tabSettings" onclick="showTab('Settings')">Settings</button>
  </div>
  <div id="list"></div>
  <div id="settings" class="hidden">
    <h3>Reminder time</h3>
    <p>The alarm checks for Pending refunds at this time every day.</p>
    <input id="reminderTime" type="time">
    <button onclick="saveReminderTime()">Save time</button>
    <button onclick="testAlarm()" style="background:#1565c0">Test alarm now</button>
    <p class="note" id="savedNote"></p>
  </div>
</div>

<div id="toast"></div>

<audio id="alarmSound" preload="auto"
  src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAA"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, orderBy, onSnapshot, doc, updateDoc, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentTab = 'Pending';
let unsubscribe = null;
let lastPendingCount = -1;
let lastAlarmDate = '';

// ---------- Sign-in ----------
window.signIn = async () => {
  try {
    document.getElementById('error').textContent = '';
    await signInWithEmailAndPassword(auth,
      document.getElementById('email').value.trim(),
      document.getElementById('password').value);
  } catch (e) {
    document.getElementById('error').textContent = 'Sign-in failed. Check email and password.';
  }
};
window.signOutOwner = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    askNotificationPermission();
    listen();
    startReminderCheck();
  } else {
    document.getElementById('login').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    if (unsubscribe) unsubscribe();
  }
});

// ---------- Tabs ----------
window.showTab = (tab) => {
  currentTab = tab;
  document.getElementById('tabPending').classList.toggle('active', tab === 'Pending');
  document.getElementById('tabDone').classList.toggle('active', tab === 'Done');
  document.getElementById('tabSettings').classList.toggle('active', tab === 'Settings');
  const isSettings = tab === 'Settings';
  document.getElementById('settings').classList.toggle('hidden', !isSettings);
  document.getElementById('list').classList.toggle('hidden', isSettings);
  if (isSettings) {
    loadReminderTime();
  } else {
    listen();
  }
};

// ---------- Live list ----------
function listen() {
  if (unsubscribe) unsubscribe();
  const status = currentTab === 'Done' ? 'Done' : 'Pending';
  const q = query(collection(db, 'refunds'),
    where('status', '==', status),
    orderBy('time', 'desc'));
  unsubscribe = onSnapshot(q, (snap) => {
    if (status === 'Pending') checkNewRequests(snap.size);
    renderList(snap, status);
  }, (err) => showToast('Error: ' + err.message));
}

function renderList(snap, status) {
  const list = document.getElementById('list');
  if (snap.empty) {
    list.innerHTML = `<div class="empty">No ${status} refunds</div>`;
    return;
  }
  list.innerHTML = '';
  snap.forEach((d) => {
    const r = d.data();
    const time = r.time && r.time.toDate ? r.time.toDate().toLocaleString() : '';
    const card = document.createElement('div');
    card.className = 'card' + (status === 'Done' ? ' done' : '');
    card.innerHTML = `
      <div class="phone">${escapeHtml(r.phone || '')}</div>
      <div class="meta">UPI: ${escapeHtml(r.upiId || '')}
Issue: ${escapeHtml(r.issue || '')}
${escapeHtml(time)}</div>`;
    if (status === 'Pending') {
      const actions = document.createElement('div');
      actions.className = 'actions';
      const chat = document.createElement('button');
      chat.className = 'btn-chat';
      chat.textContent = 'WhatsApp';
      chat.onclick = () => openWhatsApp(r.phone, r.upiId);
      const done = document.createElement('button');
      done.className = 'btn-done';
      done.textContent = 'Mark Done';
      done.onclick = () => markDoneOne(d.id);
      actions.append(chat, done);
      card.append(actions);
    }
    list.append(card);
  });
}

// ---------- Actions ----------
function openWhatsApp(phone, upi) {
  let digits = String(phone).replace(/\D/g, '');
  if (digits.length === 10) digits = '91' + digits;
  const msg = encodeURIComponent(
    `Hi, this is Softies Vending about your refund. We are processing it to UPI ID ${upi}.`);
  window.open(`https://wa.me/${digits}?text=${msg}`, '_blank');
}

async function markDoneOne(id) {
  try {
    await updateDoc(doc(db, 'refunds', id), { status: 'Done' });
    showToast('Marked as Done');
  } catch (e) {
    showToast('Could not mark done: ' + e.message);
  }
}

// ---------- New request alarm ----------
function checkNewRequests(count) {
  if (lastPendingCount !== -1 && count > lastPendingCount) {
    playAlarm();
    showToast('New refund request!');
    notify('New refund request', 'A customer has requested a refund.');
  }
  lastPendingCount = count;
}

// ---------- Reminder time (saved on the phone) ----------
const DEFAULT_TIME = '22:00';

function getReminderTime() {
  return localStorage.getItem('reminderTime') || DEFAULT_TIME;
}

function loadReminderTime() {
  const t = getReminderTime();
  document.getElementById('reminderTime').value = t;
  document.getElementById('savedNote').textContent = 'Current reminder time: ' + t;
}

window.saveReminderTime = () => {
  const t = document.getElementById('reminderTime').value;
  if (!t) {
    showToast('Please choose a time');
    return;
  }
  localStorage.setItem('reminderTime', t);
  lastAlarmDate = '';
  document.getElementById('savedNote').textContent = 'Saved. Reminder time: ' + t;
  showToast('Reminder time saved');
};

window.testAlarm = () => checkPendingAndAlarm(true);

function startReminderCheck() {
  // Checks every 30 seconds whether it is the chosen time
  setInterval(() => {
    const now = new Date();
    const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    const today = now.toDateString();
    if (hhmm === getReminderTime() && lastAlarmDate !== today) {
      lastAlarmDate = today;
      checkPendingAndAlarm(false);
    }
  }, 30000);
}

async function checkPendingAndAlarm(isTest) {
  const snap = await getDocs(query(collection(db, 'refunds'), where('status', '==', 'Pending')));
  if (snap.size > 0) {
    playAlarm();
    notify('Pending refunds', `${snap.size} refund(s) still pending. Please pay and mark them Done.`);
    showToast(`${snap.size} refund(s) still pending`);
  } else if (isTest) {
    showToast('No pending refunds');
  }
}

function playAlarm() {
  const a = document.getElementById('alarmSound');
  a.currentTime = 0;
  a.play().catch(() => {});
}

function askNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function notify(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body });
  }
}

// ---------- Helpers ----------
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => (t.style.display = 'none'), 3000);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
