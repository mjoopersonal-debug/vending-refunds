<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#D81860">
<link rel="manifest" href="manifest.json">
<title>SOFTIES Vending Refunds</title>
<style>
  :root {
    --main: #D81860;
    --bright: #FF4081;
    --light: #FFC1D9;
    --offwhite: #FFF0F5;
    --green: #4CAF50;
    --blue: #2196F3;
    --red: #F44336;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; min-height: 100vh; background: var(--offwhite); color: #5a0f2e; }

  /* Top header */
  .topbar { background: linear-gradient(180deg, var(--bright), var(--main)); color: #fff; padding: 16px 18px 26px; border-radius: 0 0 36px 36px; position: relative; overflow: hidden; }
  .topbar .row { display: flex; justify-content: space-between; align-items: center; }
  .topbar .title { font-size: 14px; opacity: .9; }
  .topbar h1 { margin: 2px 0 0; font-size: 26px; }
  .topbar .mascot { position: absolute; right: 8px; top: 10px; width: 110px; }
  .iconbtn { background: rgba(255,255,255,.25); color: #fff; border: 0; border-radius: 50%; width: 36px; height: 36px; font-size: 16px; }

  /* Summary cards */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px; margin-top: -26px; }
  .stat { background: #fff; border-radius: 18px; padding: 14px; text-align: center; box-shadow: 0 6px 16px rgba(216,24,96,.15); }
  .stat .lbl { font-size: 14px; color: var(--main); }
  .stat .num { font-size: 26px; font-weight: bold; }
  .stat.pending .num { color: var(--main); }
  .stat.done { background: #f1fbf2; }
  .stat.done .num { color: var(--green); }

  /* Menu buttons */
  .menu { padding: 0 14px; }
  .menu button { width: 100%; display: flex; align-items: center; justify-content: space-between; background: #fff; border: 0; border-radius: 18px; padding: 14px; margin-bottom: 10px; font-size: 16px; font-weight: bold; color: #5a0f2e; box-shadow: 0 4px 12px rgba(216,24,96,.12); }
  .menu .ico { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; margin-right: 12px; }
  .ico.red { background: var(--main); }
  .ico.green { background: var(--green); }
  .ico.grey { background: #7c5f6b; }
  .menu .label { flex: 1; text-align: left; }
  .menu .arrow { color: var(--main); font-size: 22px; }

  /* Lists */
  .listhead { display: flex; justify-content: space-between; align-items: center; padding: 14px 14px 0; }
  .listhead h2 { margin: 0; font-size: 20px; color: #5a0f2e; }
  .backbtn { background: none; border: 0; color: var(--main); font-size: 15px; font-weight: bold; }
  .card { background: #fff; margin: 12px 14px; padding: 14px; border-radius: 18px; box-shadow: 0 4px 14px rgba(216,24,96,.12); }
  .card .top { display: flex; align-items: center; }
  .card .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--light); margin-right: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .card .phone { font-size: 17px; font-weight: bold; color: #5a0f2e; flex: 1; }
  .card .meta { color: #7c5f6b; font-size: 13px; margin-top: 8px; white-space: pre-line; line-height: 1.5; }
  .actions { margin-top: 12px; display: flex; gap: 10px; }
  .actions button { flex: 1; padding: 10px; border: 0; border-radius: 12px; color: #fff; font-size: 14px; font-weight: bold; }
  .btn-chat { background: var(--green); }
  .btn-done { background: var(--blue); }
  .done-badge { color: var(--green); font-weight: bold; margin-top: 8px; font-size: 13px; }
  .empty { text-align: center; color: var(--main); margin-top: 50px; font-size: 16px; }

  /* Sign-in */
  #login { max-width: 380px; margin: 0 auto; min-height: 100vh; background: linear-gradient(180deg, var(--offwhite), var(--light)); padding: 40px 22px; text-align: center; }
  #login .logo-big { width: 120px; height: 120px; border-radius: 50%; background: #fff; border: 4px solid #fff; box-shadow: 0 6px 18px rgba(216,24,96,.25); margin: 0 auto; }
  #login h2 { color: var(--main); font-size: 30px; margin: 16px 0 0; }
  #login .sub { color: #5a0f2e; margin-bottom: 22px; }
  #login input, #settings input { width: 100%; padding: 14px; margin: 8px 0; font-size: 16px; border-radius: 16px; border: 1px solid var(--bright); background: #fff; color: #5a0f2e; }
  #login button, #settings button, .primary { width: 100%; padding: 15px; margin-top: 12px; border: 0; border-radius: 16px; color: #fff; font-size: 17px; font-weight: bold; background: linear-gradient(135deg, var(--bright), var(--main)); box-shadow: 0 6px 14px rgba(216,24,96,.35); }
  #error { color: var(--red); font-size: 14px; }

  /* Settings */
  #settings { margin: 14px; background: #fff; padding: 18px; border-radius: 18px; box-shadow: 0 4px 14px rgba(216,24,96,.12); }
  #settings h3 { margin: 0 0 8px; color: var(--main); }
  #settings .note { color: #7c5f6b; font-size: 14px; margin-top: 12px; }

  .hidden { display: none !important; }

  /* Red alarm popup */
  #alarmBox { display: none; position: fixed; inset: 0; background: rgba(60,0,20,.6); z-index: 99; align-items: center; justify-content: center; padding: 16px; }
  #alarmBox .box { background: #fff; padding: 26px; border-radius: 24px; text-align: center; max-width: 320px; width: 100%; color: #5a0f2e; box-shadow: 0 10px 40px rgba(216,24,96,.5); animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  #alarmBox .bell { font-size: 60px; color: var(--red); }
  #alarmBox h2 { color: #5a0f2e; margin: 8px 0 4px; font-size: 22px; }
  #alarmBox p { color: #7c5f6b; font-size: 14px; }
  #alarmBox button { width: 100%; padding: 16px; background: var(--red); color: #fff; border: 0; border-radius: 14px; font-size: 18px; font-weight: bold; margin-top: 14px; box-shadow: 0 6px 16px rgba(244,67,54,.45); }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--main); color: #fff; padding: 12px 18px; border-radius: 14px; display: none; z-index: 100; }
</style>
</head>
<body>

<!-- Sign-in screen -->
<div id="login">
  <img src="icon.png" class="logo-big" alt="SOFTIES">
  <h2>SOFTIES</h2>
  <div class="sub">Owner sign-in</div>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="signIn()">Sign in &rarr;</button>
  <p id="error"></p>
  <p style="color:var(--main);font-style:italic;margin-top:30px">Sweet Service. Always!</p>
</div>

<!-- Main app -->
<div id="app" class="hidden">
  <div class="topbar">
    <div class="row">
      <div>
        <div class="title">Hello!</div>
        <h1>Welcome Back</h1>
      </div>
      <button class="iconbtn" onclick="signOutOwner()" title="Sign out">&#x21E5;</button>
    </div>
    <img src="robot.png" class="mascot" alt="" onerror="this.style.display='none'">
  </div>

  <div class="stats">
    <div class="stat pending"><div class="lbl">Pending</div><div class="num" id="countPending">0</div></div>
    <div class="stat done"><div class="lbl">Done</div><div class="num" id="countDone">0</div></div>
  </div>

  <div id="menu" class="menu">
    <button onclick="showTab('Pending')"><span class="ico red">&#9719;</span><span class="label">Pending<br>Refunds</span><span class="arrow">&rsaquo;</span></button>
    <button onclick="showTab('Done')"><span class="ico green">&#10003;</span><span class="label">Done<br>Refunds</span><span class="arrow">&rsaquo;</span></button>
    <button onclick="showTab('Settings')"><span class="ico grey">&#9881;</span><span class="label">Settings</span><span class="arrow">&rsaquo;</span></button>
  </div>

  <div id="listScreen" class="hidden">
    <div class="listhead">
      <button class="backbtn" onclick="goHome()">&larr; Back</button>
      <h2 id="listTitle">Pending Refunds</h2>
      <span></span>
    </div>
    <div id="list"></div>
  </div>

  <div id="settingsScreen" class="hidden">
    <div class="listhead">
      <button class="backbtn" onclick="goHome()">&larr; Back</button>
      <h2>Settings</h2>
      <span></span>
    </div>
    <div id="settings">
      <h3>Daily reminder time</h3>
      <p style="color:#7c5f6b">The alarm checks for Pending refunds at this time every day.</p>
      <input id="reminderTime" type="time">
      <button onclick="saveReminderTime()">Save time</button>
      <button onclick="testAlarm()" style="background:var(--blue)">Test alarm now</button>
      <p class="note" id="savedNote"></p>
    </div>
  </div>
</div>

<!-- Red alarm popup: stays until Stop -->
<div id="alarmBox">
  <div class="box">
    <div class="bell">&#128276;</div>
    <h2>New Refund Request!</h2>
    <p id="alarmText"></p>
    <button onclick="stopAlarm()">STOP ALARM</button>
  </div>
</div>

<div id="toast"></div>

<audio id="alarmSound" preload="auto" loop>
  <source src="alarm.mp3" type="audio/mpeg">
</audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, orderBy, onSnapshot, doc, updateDoc, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentTab = 'Pending';
let unsubscribe = null;
let countUnsub = null;
let lastPendingCount = -1;
let lastAlarmDate = '';

// ---------- Sign-in ----------
window.signIn = async () => {
  try {
    document.getElementById('error').textContent = '';
    await signInWithEmailAndPassword(auth,
      document.getElementById('email').value.trim(),
      document.getElementById('password').value);
  } catch (e) {
    document.getElementById('error').textContent = 'Sign-in failed. Check email and password.';
  }
};
window.signOutOwner = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    askNotificationPermission();
    goHome();
    watchCounts();
    startReminderCheck();
  } else {
    document.getElementById('login').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
    if (unsubscribe) unsubscribe();
    if (countUnsub) countUnsub();
  }
});

// ---------- Screens ----------
function showOnly(id) {
  ['menu', 'listScreen', 'settingsScreen'].forEach((s) =>
    document.getElementById(s).classList.toggle('hidden', s !== id));
}

window.goHome = () => {
  if (unsubscribe) unsubscribe();
  showOnly('menu');
};

window.showTab = (tab) => {
  currentTab = tab;
  if (tab === 'Settings') {
    showOnly('settingsScreen');
    loadReminderTime();
    return;
  }
  showOnly('listScreen');
  document.getElementById('listTitle').textContent = tab === 'Done' ? 'Done Refunds' : 'Pending Refunds';
  listen();
};

// ---------- Live counts on the dashboard ----------
function watchCounts() {
  if (countUnsub) countUnsub();
  countUnsub = onSnapshot(query(collection(db, 'refunds'), where('status', '==', 'Pending')),
    (snap) => {
      document.getElementById('countPending').textContent = snap.size;
      checkNewRequests(snap.size);
    });
  getDocs(query(collection(db, 'refunds'), where('status', '==', 'Done')))
    .then((s) => document.getElementById('countDone').textContent = s.size)
    .catch(() => {});
}

// ---------- Live list ----------
function listen() {
  if (unsubscribe) unsubscribe();
  const status = currentTab === 'Done' ? 'Done' : 'Pending';
  const q = query(collection(db, 'refunds'), where('status', '==', status), orderBy('time', 'desc'));
  unsubscribe = onSnapshot(q, (snap) => renderList(snap, status),
    (err) => showToast('Error: ' + err.message));
}

function renderList(snap, status) {
  const list = document.getElementById('list');
  if (snap.empty) {
    list.innerHTML = `<div class="empty">No ${status} refunds</div>`;
    return;
  }
  list.innerHTML = '';
  snap.forEach((d) => {
    const r = d.data();
    const time = r.time && r.time.toDate ? r.time.toDate().toLocaleString() : '';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="top">
        <div class="avatar">&#128100;</div>
        <div class="phone">${escapeHtml(r.phone || '')}</div>
      </div>
      <div class="meta">UPI: ${escapeHtml(r.upiId || '')}
Issue: ${escapeHtml(r.issue || '')}
${escapeHtml(time)}</div>`;
    if (status === 'Pending') {
      const actions = document.createElement('div');
      actions.className = 'actions';
      const chat = document.createElement('button');
      chat.className = 'btn-chat';
      chat.textContent = 'WhatsApp';
      chat.onclick = () => openWhatsApp(r.phone, r.upiId);
      const done = document.createElement('button');
      done.className = 'btn-done';
      done.textContent = '\u2713 Mark Done';
      done.onclick = () => markDoneOne(d.id);
      actions.append(chat, done);
      card.append(actions);
    } else {
      const badge = document.createElement('div');
      badge.className = 'done-badge';
      badge.textContent = '\u2713 Completed';
      card.append(badge);
    }
    list.append(card);
  });
}

// ---------- Actions ----------
function openWhatsApp(phone, upi) {
  let digits = String(phone).replace(/\D/g, '');
  if (digits.length === 10) digits = '91' + digits;
  const msg = encodeURIComponent(`Hi, this is Softies Vending about your refund. We are processing it to UPI ID ${upi}.`);
  window.open(`https://wa.me/${digits}?text=${msg}`, '_blank');
}

async function markDoneOne(id) {
  try {
    await updateDoc(doc(db, 'refunds', id), { status: 'Done' });
    showToast('Refund marked as Done');
  } catch (e) {
    showToast('Could not mark done: ' + e.message);
  }
}

// ---------- New request alarm ----------
function checkNewRequests(count) {
  if (lastPendingCount !== -1 && count > lastPendingCount) {
    ringAlarm('A customer has requested a refund from the vending machine.');
  }
  lastPendingCount = count;
}

// ---------- Alarm (sound + popup, stays until Stop) ----------
window.ringAlarm = (text) => {
  document.getElementById('alarmText').textContent = text;
  document.getElementById('alarmBox').style.display = 'flex';
  const a = document.getElementById('alarmSound');
  a.currentTime = 0;
  a.play().catch(() => showToast('Tap STOP ALARM. Sound was blocked by the phone.'));
  notify('Refund alarm', text);
};

window.stopAlarm = () => {
  const a = document.getElementById('alarmSound');
  a.pause();
  a.currentTime = 0;
  document.getElementById('alarmBox').style.display = 'none';
};

// ---------- Reminder time (saved on the phone) ----------
const DEFAULT_TIME = '22:00';
const getReminderTime = () => localStorage.getItem('reminderTime') || DEFAULT_TIME;

function loadReminderTime() {
  const t = getReminderTime();
  document.getElementById('reminderTime').value = t;
  document.getElementById('savedNote').textContent = 'Current reminder time: ' + t;
}

window.saveReminderTime = () => {
  const t = document.getElementById('reminderTime').value;
  if (!t) { showToast('Please choose a time'); return; }
  localStorage.setItem('reminderTime', t);
  lastAlarmDate = '';
  document.getElementById('savedNote').textContent = 'Saved. Reminder time: ' + t;
  showToast('Reminder time saved');
};

window.testAlarm = async () => {
  const snap = await getDocs(query(collection(db, 'refunds'), where('status', '==', 'Pending')));
  if (snap.size > 0) {
    ringAlarm(`${snap.size} refund(s) still pending. Please pay and mark them Done.`);
  } else {
    showToast('No pending refunds');
  }
};

function startReminderCheck() {
  setInterval(async () => {
    const now = new Date();
    const hhmm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    const today = now.toDateString();
    if (hhmm === getReminderTime() && lastAlarmDate !== today) {
      lastAlarmDate = today;
      const snap = await getDocs(query(collection(db, 'refunds'), where('status', '==', 'Pending')));
      if (snap.size > 0) {
        ringAlarm(`${snap.size} refund(s) still pending. Please pay and mark them Done.`);
      }
    }
  }, 30000);
}

// ---------- Notifications and helpers ----------
function askNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function notify(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title, { body });
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => (t.style.display = 'none'), 3000);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
