<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#D81860">
<title>Request a Refund - SOFTIES</title>
<style>
  :root { --main:#D81860; --bright:#FF4081; --light:#FFC1D9; --offwhite:#FFF0F5; --green:#4CAF50; --red:#F44336; }
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; min-height: 100vh; background: linear-gradient(180deg, #fff 0%, var(--light) 100%); color: #5a0f2e; position: relative; overflow-x: hidden; }
  header { background: linear-gradient(180deg, var(--bright), var(--main)); color: #fff; padding: 18px; text-align: center; font-size: 20px; font-weight: bold; border-radius: 0 0 30px 30px; }
  .card { background: #fff; margin: 18px 16px; padding: 18px; border-radius: 22px; box-shadow: 0 6px 18px rgba(216,24,96,.15); position: relative; z-index: 1; }
  .logo { display: block; width: 180px; max-width: 65%; margin: 4px auto 6px; }
  .title { text-align: center; font-size: 22px; font-weight: bold; color: var(--main); margin: 6px 0 12px; }
  label { display: block; margin-top: 14px; font-weight: bold; color: #5a0f2e; font-size: 15px; }
  input, textarea { width: 100%; padding: 13px; margin-top: 6px; font-size: 16px; border-radius: 14px; border: 1px solid var(--bright); background: var(--offwhite); color: #5a0f2e; font-family: inherit; }
  textarea { resize: vertical; min-height: 80px; }
  .hint { color: #7c5f6b; font-size: 13px; margin-top: 4px; }
  button { width: 100%; margin-top: 20px; padding: 15px; background: linear-gradient(135deg, var(--bright), var(--main)); color: #fff; border: 0; border-radius: 16px; font-size: 17px; font-weight: bold; box-shadow: 0 6px 14px rgba(216,24,96,.35); }
  button:disabled { background: #bbb; box-shadow: none; }
  #msg { text-align: center; margin: 18px; font-size: 17px; }
  .ok { color: var(--green); font-weight: bold; }
  .err { color: var(--red); font-weight: bold; }
  .success { display: none; text-align: center; padding: 20px 10px; }
  .success .tick { width: 90px; height: 90px; border-radius: 50%; background: var(--green); color: #fff; font-size: 52px; line-height: 90px; margin: 0 auto; box-shadow: 0 0 24px rgba(76,175,80,.6); }
  .success h2 { color: var(--main); margin: 16px 0 6px; }
  .success p { color: #7c5f6b; }
  .cone { display: block; width: 130px; margin: 10px auto 0; }
  .wave { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; pointer-events: none; z-index: 0; }
  .footer { text-align: center; color: var(--main); font-style: italic; margin: 10px 0 24px; position: relative; z-index: 1; }

  /* Intro: four screens, one at a time, about 8 seconds, tap to skip */
  #intro { position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: linear-gradient(180deg, #ffe4ef, #ffc1d9); cursor: pointer; font-family: 'Segoe UI', Arial, sans-serif; }
  #intro .frame { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; animation-duration: 8s; animation-timing-function: linear; animation-fill-mode: forwards; }
  #intro .f1 { animation-name: f1; }
  #intro .f2 { animation-name: f2; }
  #intro .f3 { animation-name: f3; }
  #intro .f4 { animation-name: f4; }
  #intro .blob { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, #e8579a, rgba(232,87,154,0)); filter: blur(6px); opacity: .55; }
  #intro .mascot { width: 200px; animation: bounceIn .8s ease-out .2s both; }
  #intro .logo { width: 280px; max-width: 80%; }
  #intro .spark { position: absolute; color: #ffc94d; font-size: 26px; animation: twinkle 1.2s ease-in-out infinite; }
  #intro .tag { color: #c8195f; font-weight: bold; letter-spacing: 2px; font-size: 13px; margin-top: 6px; }
  #intro .cta { margin-top: 26px; background: linear-gradient(135deg, #ff4081, #d81860); color: #fff; padding: 14px 28px; border-radius: 24px; font-weight: bold; font-size: 16px; box-shadow: 0 8px 18px rgba(216,24,96,.35); }
  #intro .hint { position: absolute; top: 14px; right: 16px; color: #c8195f; font-size: 13px; z-index: 2; }
  /* Each screen is visible only in its own time slot, so only one set shows at once */
  @keyframes f1 { 0% { opacity: 0; } 20% { opacity: 1; } 40% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes f2 { 0%, 50% { opacity: 0; } 55% { opacity: 1; } 80% { opacity: 1; } 90% { opacity: 0; } 100% { opacity: 0; } }
  @keyframes f3 { 0%, 90% { opacity: 0; } 95% { opacity: 1; } 100% { opacity: 1; } }
  @keyframes f4 { 0%, 100% { opacity: 0; } }
  @keyframes bounceIn { 0% { transform: scale(.3); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes twinkle { 0%, 100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }
</style>
</head>
<body>

<div id="intro" onclick="closeIntro()">
  <div class="hint">Tap to skip</div>

  <div class="frame f1">
    <div class="blob"></div>
  </div>

  <div class="frame f2">
    <img class="mascot" src="robot.png" alt="" onerror="this.remove()">
    <img class="logo" src="icon.png" alt="SOFTIES">
  </div>

  <div class="frame f3">
    <span class="spark" style="top:22%;left:24%">&#10022;</span>
    <span class="spark" style="top:26%;right:24%;animation-delay:.4s">&#10022;</span>
    <span class="spark" style="bottom:28%;left:28%;animation-delay:.8s">&#10022;</span>
    <img class="mascot" src="robot.png" alt="" onerror="this.remove()">
    <img class="logo" src="icon.png" alt="SOFTIES">
    <div class="tag">SOFT SERVE ICE CREAM</div>
  </div>

  <div class="frame f4" style="animation: none; opacity: 1;">
    <img class="mascot" src="robot.png" alt="" onerror="this.remove()">
    <img class="logo" src="icon.png" alt="SOFTIES">
    <div class="tag">SOFT SERVE ICE CREAM</div>
    <div class="cta">Explore Menu &rarr;</div>
  </div>
</div>

<header>Request a Refund</header>

<div id="formView">
  <div class="card">
    <img src="icon.png" class="logo" alt="SOFTIES">
    <div class="title">Tell us what happened</div>
    <form id="refundForm">
      <label for="phone">Your mobile number</label>
      <input id="phone" type="tel" inputmode="numeric" placeholder="9876543210" required>
      <div class="hint">10 digits, without +91</div>

      <label for="upi">Your UPI ID</label>
      <input id="upi" type="text" placeholder="name@upi" required>

      <label for="issue">What happened?</label>
      <textarea id="issue" placeholder="Machine took my money, no item came out" required></textarea>

      <label for="amount">Amount paid (optional)</label>
      <input id="amount" type="number" inputmode="decimal" placeholder="e.g. 20">

      <button id="submitBtn" type="submit">Submit request</button>
    </form>
    <p id="msg"></p>
  </div>
  <div class="footer">We'll take care of it!</div>
  <img src="cone.png" class="cone" alt="">
</div>

<div id="successView" class="success card">
  <div class="tick">&#10003;</div>
  <h2>Refund Request Received!</h2>
  <p>The customer will be notified soon.</p>
  <button onclick="location.reload()">OK</button>
</div>

<img src="wave.png" class="wave" alt="">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const db = getFirestore(initializeApp(firebaseConfig));
const COOLDOWN_MS = 2 * 60 * 1000;

document.getElementById('refundForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');

  const last = Number(localStorage.getItem('lastRefundSubmit') || 0);
  if (Date.now() - last < COOLDOWN_MS) {
    msg.className = 'err';
    msg.textContent = 'Please wait a couple of minutes before sending another request.';
    return;
  }

  const digits = document.getElementById('phone').value.replace(/\D/g, '');
  if (digits.length !== 10) {
    msg.className = 'err';
    msg.textContent = 'Please enter a 10-digit mobile number.';
    return;
  }
  const upi = document.getElementById('upi').value.trim();
  const issue = document.getElementById('issue').value.trim();
  const amount = document.getElementById('amount').value;

  btn.disabled = true;
  btn.textContent = 'Sending...';
  try {
    await addDoc(collection(db, 'refunds'), {
      phone: '91' + digits,
      upiId: upi.slice(0, 60),
      issue: issue.slice(0, 500),
      status: 'Pending',
      time: serverTimestamp(),
      amount: amount ? Number(amount) : null
    });
    localStorage.setItem('lastRefundSubmit', String(Date.now()));
    document.getElementById('formView').style.display = 'none';
    document.getElementById('successView').style.display = 'block';
  } catch (err) {
    msg.className = 'err';
    msg.textContent = 'Could not send. Please try again.';
    btn.disabled = false;
    btn.textContent = 'Submit request';
  }
});
</script>

<script>
function closeIntro(){ var el=document.getElementById('intro'); if(el) el.remove(); }
// Show once per browser session, then skip it on later visits in the same tab
if (sessionStorage.getItem('introSeen')) { closeIntro(); }
else { sessionStorage.setItem('introSeen','1'); setTimeout(closeIntro, 8000); }
</script>
</body>
</html>
